name: Zgłoszenie błędu (Bug Report)
description: Zgłoś problem z aplikacją Iron Routine (iOS, Android lub Live Activities)
title: "[BUG] "
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy za zgłoszenie błędu! Podaj jak najwięcej szczegółów, abyśmy mogli szybko go naprawić.
  - type: dropdown
    id: platform
    attributes:
      label: Platforma (Project Field - Platform)
      options:
        - iOS & Android
        - iOS (Live Activities / Dynamic Island)
        - Android (APK)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet (Project Field - Priority)
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Obszar (Project Field - Area)
      options:
        - Active Workout & Timer
        - Live Activities
        - Notifications & Creatine
        - Progress & Charts
        - Storage & Backup
        - UI/UX
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wersja aplikacji i systemu
      placeholder: "v1.0.0 / iOS 18.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Opis błędu
      description: Co się stało, a co powinno się wydarzyć?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki do odtworzenia
      placeholder: |
        1. Rozpocznij trening na ekranie Dziś
        2. Uruchom timer przerwy...
  - type: textarea
    id: screenshots
    attributes:
      label: Zrzuty ekranu (opcjonalnie)
      description: Przeciągnij i upuść zrzuty ekranu tutaj.
