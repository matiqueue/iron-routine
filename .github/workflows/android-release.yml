name: Build & Release Android (Google Play AAB + APK)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Wersja SemVer wydania (np. v3.1.1)'
        required: true
        default: 'v3.1.1'
      release_title:
        description: 'Tytuł wydania (opcjonalny)'
        required: false
        default: ''
      publish_github_release:
        description: 'Opublikuj / zaktualizuj GitHub Release z plikami APK + AAB'
        type: boolean
        required: false
        default: true
      upload_google_play:
        description: 'Wyślij automatycznie .AAB do Google Play (wymaga sekretu GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release:
    name: Resolve Release Target
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Signed Android AAB & APK
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Decode Android Upload Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/iron-routine-upload.p12
            echo "path=/tmp/iron-routine-upload.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Production upload keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not configured; building with debug keystore."
          fi
          if [ -n "$PLAY_JSON" ]; then
            echo "has_play_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Signed Google Play AAB & Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --parallel

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/iron-routine-upload.p12

      - name: Prepare Release Artifacts
        run: |
          TAG="${{ needs.check-release.outputs.tag }}"
          mkdir -p build-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab "build-artifacts/IronRoutine-${TAG}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/IronRoutine.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/IronRoutine-${TAG}.apk"
          ls -lh build-artifacts/

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IronRoutine-GooglePlay-AAB-${{ needs.check-release.outputs.tag }}
          path: build-artifacts/IronRoutine-*.aab
          retention-days: 90

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IronRoutine-Android-APK-${{ needs.check-release.outputs.tag }}
          path: build-artifacts/IronRoutine.apk
          retention-days: 90

      - name: Extract Changelog Notes
        id: changelog
        run: |
          VER="${{ needs.check-release.outputs.version }}"
          NOTES=$(node -e "
            const fs = require('fs');
            const md = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '';
            const re = new RegExp('## \\\\[' + '${VER}'.replace(/\\./g, '\\\\.') + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)');
            const m = md.match(re);
            console.log(m ? m[1].trim() : 'Release ${VER}');
          ")
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_github_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: ${{ github.event.inputs.release_title || needs.check-release.outputs.tag }}
          body: |
            ### Iron Routine ${{ needs.check-release.outputs.tag }} — Wydanie na Androida (.APK + Google Play .AAB)

            ${{ steps.changelog.outputs.notes }}

            ---
            - **[Pobierz IronRoutine.apk](https://github.com/matiqueue/iron-routine/releases/download/${{ needs.check-release.outputs.tag }}/IronRoutine.apk)** (bezpośrednia instalacja na Androida)
            - Wersjonowany APK: `IronRoutine-${{ needs.check-release.outputs.tag }}.apk`
            - Paczka Google Play: `IronRoutine-${{ needs.check-release.outputs.tag }}.aab`
          draft: false
          prerelease: false
          files: |
            build-artifacts/IronRoutine.apk
            build-artifacts/IronRoutine-*.apk
            build-artifacts/IronRoutine-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Google Play (Internal Track)
        if: |
          steps.keystore.outputs.signed == 'true' &&
          steps.keystore.outputs.has_play_key == 'true' &&
          (github.event_name == 'push' || github.event.inputs.upload_google_play == 'true')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.matique.ironroutine
          releaseFiles: build-artifacts/IronRoutine-*.aab
          track: internal
          status: completed
