name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Wersja wydania (np. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Tytuł wydania'
        required: false
        default: 'Iron Routine v1.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            APP_VER=$(node -p "require('./package.json').version")
            TAG="v${APP_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} już istnieje — pomijam zbędny build APK."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build Android APK
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          TAG="${{ needs.check-release.outputs.tag }}"
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/IronRoutine.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/IronRoutine-${TAG}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IronRoutine-Android-APK
          path: build-artifacts/IronRoutine.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: ${{ github.event.inputs.release_title || needs.check-release.outputs.tag }}
          body: |
            ### Iron Routine - Wydanie na Androida (.APK)

            Pobierz gotowy plik instalacyjny **Iron Routine**:
            - **[Pobierz IronRoutine.apk](https://github.com/matiqueue/iron-routine/releases/download/${{ needs.check-release.outputs.tag }}/IronRoutine.apk)**
            - Plik z wersją: `IronRoutine-${{ needs.check-release.outputs.tag }}.apk`

            Kompilacja wygenerowana automatycznie z otwartego kodu źródłowego przez GitHub Actions.
          draft: false
          prerelease: false
          files: |
            build-artifacts/IronRoutine.apk
            build-artifacts/IronRoutine-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
