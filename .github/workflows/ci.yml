name: CI Typecheck & Config Verification

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript & Expo Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Run mobile TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit tests (E2EE, Nicknames, Cloud Security)
        run: npm test

      - name: Verify Expo config & plugins
        run: npx expo config --type public > /dev/null

      - name: Verify website TypeScript & production build
        working-directory: website
        run: npx tsc --noEmit && npm run build
