<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F1F23" stroke-width="1" />
    </pattern>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <linearGradient id="skySlashGrad" x1="9.7" y1="49.7" x2="54.3" y2="14.3" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="35%" stop-color="#7DD3FC" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <radialGradient id="iconAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bgFade)" />
  <rect width="1280" height="360" fill="url(#grid)" />
  <rect x="24" y="24" width="1232" height="312" stroke="#27272A" stroke-width="1.5" />

  <!-- Top Telemetry Strip -->
  <text x="64" y="68" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3">
    OFFLINE STRENGTH OS // EXPO SDK 58 // iOS &amp; ANDROID
  </text>
  <rect x="1082" y="50" width="134" height="26" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
  <text x="1149" y="67" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">
    100% OFFLINE
  </text>

  <!-- Hex Collar + Light-Blue Gradient Talon App Emblem -->
  <g transform="translate(64, 118)">
    <rect x="0" y="0" width="112" height="112" rx="26" fill="#06080D" stroke="#27272A" stroke-width="1.5" />
    <circle cx="56" cy="56" r="52" fill="url(#iconAmbient)" />
    <g transform="translate(12, 12) scale(1.375)">
      <path
        fill="url(#plateGrad)"
        d="M8.6 41.4 L8.6 21.5 L11.2 17.0 L29.4 6.5 L34.6 6.5 L46.9 13.6 L37.8 20.2 L33.4 17.7 L30.6 17.7 L20.3 23.6 L18.9 26.1 L18.9 34.0 Z M55.4 22.6 L55.4 42.5 L52.8 47.0 L34.6 57.5 L29.4 57.5 L17.1 50.4 L26.2 43.8 L30.6 46.3 L33.4 46.3 L43.7 40.4 L45.1 37.9 L45.1 30.0 Z"
      />
      <path
        fill="url(#skySlashGrad)"
        d="M9.7 49.7 C29.0 40.0 40.1 29.6 54.3 14.3 C35.0 24.0 23.9 34.4 9.7 49.7 Z"
      />
    </g>
  </g>

  <!-- Main Title -->
  <text x="212" y="176" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
    IRON ROUTINE
  </text>
  <text x="214" y="216" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
