<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F1F23" stroke-width="1" />
    </pattern>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bgFade)" />
  <rect width="1280" height="360" fill="url(#grid)" />
  <rect x="24" y="24" width="1232" height="312" stroke="#27272A" stroke-width="1.5" />

  <!-- Top Telemetry Strip -->
  <text x="64" y="68" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3">
    OFFLINE STRENGTH OS // EXPO SDK 58 // iOS &amp; ANDROID
  </text>
  <rect x="1082" y="50" width="134" height="26" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
  <text x="1149" y="67" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">
    100% OFFLINE
  </text>

  <!-- Minimalist Barbell Icon -->
  <g transform="translate(64, 128)">
    <rect x="0" y="22" width="12" height="44" rx="2" fill="#71717A" />
    <rect x="16" y="10" width="16" height="68" rx="2" fill="url(#plateGrad)" />
    <rect x="36" y="39" width="44" height="10" fill="#FAFAFA" />
    <rect x="84" y="10" width="16" height="68" rx="2" fill="url(#plateGrad)" />
    <rect x="104" y="22" width="12" height="44" rx="2" fill="#71717A" />
  </g>

  <!-- Main Title -->
  <text x="212" y="176" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
    IRON ROUTINE
  </text>
  <text x="214" y="216" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    Monochromatyczny dziennik treningowy &amp; tracker progresu 1RM
  </text>

  <!-- Bottom Monochrome Stat Pills -->
  <g transform="translate(64, 264)">
    <rect x="0" y="0" width="210" height="40" fill="#121215" stroke="#27272A" stroke-width="1" />
    <text x="16" y="25" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">
      LIVE ACTIVITY + ISLAND
    </text>

    <rect x="226" y="0" width="180" height="40" fill="#121215" stroke="#27272A" stroke-width="1" />
    <text x="242" y="25" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">
      1RM EPLEY + SVG
    </text>

    <rect x="422" y="0" width="215" height="40" fill="#121215" stroke="#27272A" stroke-width="1" />
    <text x="438" y="25" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">
      CREATINE REMINDERS
    </text>

    <rect x="653" y="0" width="175" height="40" fill="#FAFAFA" />
    <text x="740" y="25" text-anchor="middle" fill="#09090B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="900" letter-spacing="1">
      ZERO ACCOUNTS
    </text>
  </g>
</svg>
